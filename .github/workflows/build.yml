name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Geode CLI
      uses: geode-sdk/install-geode-cli@v1
      with:
        cli-version: latest

    - name: Configure and Build Mod
      run: |
        geode new --name "UltraFPSBooster480" --id "dev.ultrabypass480" --developer "CustomMod" --no-interaction || true
        geode build --config Release

    - name: Upload Artifact (.geode file)
      uses: actions/upload-artifact@v4
      with:
        name: UltraFPSBooster480
        path: build/*.geode
