name: Build Geode Mod
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Project Structure
        shell: pwsh
        run: |
          if (!(Test-Path "src")) {
            New-Item -ItemType Directory -Path "src" | Out-Null
          }
          if (Test-Path "main.cpp") {
            Copy-Item "main.cpp" "src/main.cpp" -Force
          }

          $modJson = [ordered]@{
            geode = "4.4.0"
            gd = @{
              win = "2.2081"
            }
            id = "yingseo.true480fps.unlocker"
            name = "True 480+ FPS ZeroError Engine"
            version = "v6.0.0"
            developer = "YingSeo"
            description = "True 480+ FPS Floor, Anti-Blur/Tear & Eclipse Synergy."
            "early-load" = $true
          } | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD/mod.json", $modJson, (New-Object System.Text.UTF8Encoding($false)))

          $cmake = @(
            'cmake_minimum_required(VERSION 3.21)',
            'set(CMAKE_CXX_STANDARD 20)',
            'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
            'project(True480FPSMod VERSION 6.0.0)',
            'add_library(${PROJECT_NAME} SHARED src/main.cpp)',
            'if (NOT DEFINED ENV{GEODE_SDK})',
            '    message(FATAL_ERROR "Unable to find Geode SDK!")',
            'endif()',
            'add_subdirectory($ENV{GEODE_SDK} ${CMAKE_CURRENT_BINARY_DIR}/geode)',
            'setup_geode_mod(${PROJECT_NAME})'
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/CMakeLists.txt", $cmake, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

      - name: Upload Geode Package
        uses: actions/upload-artifact@v4
        with:
          name: True480FPS-ZeroError-v6
          path: |
            ${{ steps.build.outputs.build-output }}
            **/*.geode
